name: Refresh subscriptions

on:
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/**
      - requirements.lock
      - .github/workflows/refresh.yml

permissions: {}
concurrency:
  group: refresh-subscriptions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check two-day schedule
        id: schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Absolute UTC day parity keeps the two-day interval across month boundaries.
          if [[ "$EVENT_NAME" != schedule ]] || (( $(date -u +%s) / 86400 % 2 == 0 )); then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.schedule.outputs.due == 'true'
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.schedule.outputs.due == 'true'
        with:
          python-version: '3.11'
      - name: Install parser
        if: steps.schedule.outputs.due == 'true'
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test checker
        if: steps.schedule.outputs.due == 'true'
        run: python -m unittest discover -s tests
      - name: Check upstream subscriptions
        if: steps.schedule.outputs.due == 'true'
        id: check
        run: python scripts/check_sources.py
      - name: Publish result.m3u release asset
        if: ${{ !cancelled() && steps.check.outputs.live_ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_playlist.py
      - name: Update README and check record
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md checks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: 更新订阅地址和检测状态'
          gh auth setup-git
          git push origin HEAD:main
