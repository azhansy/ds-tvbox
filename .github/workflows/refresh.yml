name: Refresh subscriptions

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/check_sources.py
      - requirements.lock
      - .github/workflows/refresh.yml

permissions: {}
concurrency:
  group: refresh-subscriptions
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install parser
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Test checker
        run: python -m unittest discover -s tests
      - name: Check upstream subscriptions
        id: check
        run: python scripts/check_sources.py
      - name: Update README and check record
        if: ${{ !cancelled() && steps.check.outputs.ready == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- README.md checks.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: 更新订阅地址和检测状态'
          gh auth setup-git
          git push origin HEAD:main
